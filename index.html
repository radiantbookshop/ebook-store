<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161616">
<title>Radiant eBookshop — အီးဘုတ်ခ်စာအုပ်ဆိုင်</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="chat.css">
</head>
<body>
<header class="topbar">
  <div class="toprow">
    <a class="brand" href="#/">
      <span class="mark">R</span>
      <span class="word"><b>Radiant</b><small>eBookshop</small></span>
    </a>
    <a class="homebtn" href="#/" aria-label="Home">🏠</a>
  </div>
  <nav class="cattabs" id="catTabs">
    <button data-cat="all" class="active">All</button>
    <button data-cat="english">English</button>
    <button data-cat="maths">Maths</button>
    <button data-cat="science">Science</button>
    <button data-cat="others">Others</button>
  </nav>
  <form id="searchForm" class="searchbar" role="search" autocomplete="off">
    <input id="q" type="search" placeholder="စာအုပ်နာမည် ရိုက်ရှာပါ…" aria-label="စာအုပ်ရှာရန်">
    <button type="submit" aria-label="ရှာရန်">🔍</button>
  </form>
</header>
<main id="view"></main>
<footer class="foot">ဝယ်ယူမှုအားလုံး Telegram bot မှတစ်ဆင့် လုံခြုံစွာ ဆောင်ရွက်ပါသည် 📩 <span style="opacity:.3;font-size:10px">v20260927i</span></footer>
<button id="chatFab" aria-label="အကူအညီ chat">💬<span class="dot"></span></button>
<div id="chatPanel" role="dialog" aria-label="အကူအညီ chat">
  <div id="chatHead">
    <span class="mark">R</span>
    <div><b>အကူအညီ</b><small>Radiant eBookshop • အွန်လိုင်း</small></div>
    <button class="x" aria-label="ပိတ်ရန်">✕</button>
  </div>
  <div id="chatMsgs"></div>
  <div id="chatQuick"></div>
  <form id="chatForm">
    <input type="file" id="chatFile" accept="image/*">
    <button type="button" class="imgbtn" aria-label="ပုံတင်ရန်">📷</button>
    <input type="text" id="chatInput" placeholder="စာရိုက်ပါ…" autocomplete="off">
    <button type="submit" class="sendbtn" aria-label="ပို့ရန်">➤</button>
  </form>
</div>
<script src="config.js"></script>
<script src="app.js?v=20260927i"></script>
<script src="chat.js"></script>
</body>
</html>
